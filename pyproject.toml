[project]
name = "uk-dfs"
version = "0.1.0"
description = "Does the flexibility NESO pays for through the Demand Flexibility Service show up in the data?"
readme = "README.md"
authors = [
    { name = "James Hughes", email = "jhughes2712@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: import sorting, B: bugbear, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
